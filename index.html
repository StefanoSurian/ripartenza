<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestroxa">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Palestroxa</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f2f2f7; --card:#fff; --fill:rgba(118,118,128,.12); --thumb:#fff;
    --sep:rgba(60,60,67,.18);
    --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
    --accent:#0a7bc2; --on:#28a745; --off:#e8820c;
    --p:#3478f6; --c:#f5a524; --g:#2bbf8a;
    --bar:rgba(249,249,251,.72);
    --round:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#000; --card:#1c1c1e; --fill:rgba(118,118,128,.24); --thumb:#636366;
      --sep:rgba(84,84,88,.5);
      --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.28);
      --accent:#64d2ff; --on:#30d158; --off:#ff9f0a;
      --p:#5e9eff; --c:#ffb340; --g:#4fd8a6;
      --bar:rgba(30,30,32,.7);
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg);color:var(--label);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
    letter-spacing:-.01em;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  b{font-weight:600;}
  .num{font-variant-numeric:tabular-nums;}
  .mut{color:var(--label2);}

  .wrap{max-width:640px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom));}
  .eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;padding-top:18px;}
  h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:2px 0 16px;}
  h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:30px 4px 10px;}
  .foot{font-size:13px;color:var(--label2);margin:10px 4px 0;line-height:1.45;}
  .foot b{color:var(--label);}

  .view{display:none;}
  .view.active{display:block;}

  /* cards & lists */
  .card{background:var(--card);border-radius:22px;overflow:hidden;}
  .card+.card{margin-top:12px;}
  .pad{padding:16px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:48px;position:relative;}
  .row+.row::before,.row+details::before,details+.row::before,details+details::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep);}
  .row .r,summary .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .row .sub,summary .sub{display:block;font-size:13px;color:var(--label2);margin-top:1px;}
  .row.stack{display:block;}
  .row.stack p{font-size:14px;color:var(--label2);margin-top:3px;line-height:1.45;}
  .row.stack p b{color:var(--label);}

  /* disclosures */
  details{position:relative;}
  summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:48px;}
  summary::-webkit-details-marker{display:none;}
  summary>span:first-child{flex:1;min-width:0;}
  summary::after{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--label3);border-bottom:2px solid var(--label3);transform:rotate(-45deg);transition:transform .2s;margin-right:4px;}
  details[open]>summary::after{transform:rotate(45deg);}
  .dbody{padding:0 16px 14px;font-size:14px;line-height:1.5;color:var(--label2);}
  .dbody b{color:var(--label);}
  .dbody i{font-style:normal;color:var(--label3);}
  .dbody p+p{margin-top:8px;}
  .dbody ul{list-style:none;}
  .dbody li{padding-left:14px;position:relative;margin-top:4px;}
  .dbody li::before{content:'';position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--label3);}

  /* segmented */
  .sticky{position:sticky;top:env(safe-area-inset-top);z-index:20;margin:0 -16px;padding:8px 16px 10px;background:var(--bg);}
  .seg{--n:2;--i:0;position:relative;display:flex;background:var(--fill);border-radius:100px;padding:3px;}
  .seg::before{content:'';position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:100px;background:var(--thumb);box-shadow:0 2px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(var(--i)*100%));transition:transform .28s cubic-bezier(.3,.7,.2,1);}
  .seg button{flex:1;position:relative;z-index:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--label);padding:7px 2px;cursor:pointer;white-space:nowrap;letter-spacing:-.01em;}
  .seg button:not(.on){color:var(--label2);}
  .seg.sm button{font-size:13px;padding:5px 2px;}

  /* hero */
  .hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  .big{font-family:var(--round);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .big small{font-size:20px;font-weight:600;color:var(--label2);letter-spacing:-.01em;}
  .kicker{font-size:13px;color:var(--label2);font-weight:500;margin-bottom:6px;}
  .chart{display:block;width:100%;height:auto;margin-top:14px;overflow:visible;}
  .chart text{font:500 10px -apple-system,system-ui,sans-serif;fill:var(--label2);}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--sep);}
  .chips div{padding:12px 4px;text-align:center;}
  .chips div+div{border-left:.5px solid var(--sep);}
  .chips span{display:block;font-size:11px;color:var(--label2);text-transform:uppercase;letter-spacing:.03em;}
  .chips b{font-family:var(--round);font-size:17px;font-variant-numeric:tabular-nums;}

  /* day summary */
  .day-sum{display:flex;align-items:center;gap:18px;}
  .day-sum .big{color:var(--tone);}
  .macros{flex:1;display:grid;gap:7px;}
  .mrow{display:grid;grid-template-columns:16px 1fr 44px;align-items:center;gap:8px;font-size:13px;}
  .mrow i{font-style:normal;font-weight:700;color:var(--m);}
  .mrow .track{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;}
  .mrow .track div{height:100%;border-radius:3px;background:var(--m);}
  .mrow span{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  .tone-on{--tone:var(--on);} .tone-off{--tone:var(--off);}

  /* meal */
  .meal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 4px;}
  .meal-h h3{font-size:19px;font-weight:700;letter-spacing:-.02em;}
  .meal-h .sub{font-size:13px;color:var(--label2);}
  .meal-h .kcal{font-family:var(--round);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .meal-h .kcal small{font-size:12px;color:var(--label2);font-weight:600;}
  .mline{display:flex;gap:12px;align-items:center;padding:4px 16px 10px;font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;}
  .mline b{color:var(--label);}
  .mline .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px;}
  .split{display:flex;height:4px;border-radius:2px;overflow:hidden;flex:1;min-width:40px;gap:2px;}
  .split div{height:100%;border-radius:2px;}
  .food .q{font-variant-numeric:tabular-nums;color:var(--label2);white-space:nowrap;}
  .food .n small{color:var(--label2);font-size:13px;}
  .inner-seg{padding:4px 16px 8px;}
  .vmeta{font-size:12px;color:var(--label2);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums;}
  .sumtag{font-size:15px;}
  .sumtag em{font-style:normal;color:var(--label2);font-size:13px;margin-left:6px;}

  /* workout */
  .wo-h{padding:18px 16px 8px;}
  .wo-h .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:100px;padding:3px 10px;margin-bottom:8px;}
  .wo-h h3{font-size:24px;font-weight:700;letter-spacing:-.025em;}
  .wo-h p{font-size:14px;color:var(--label2);}
  .ex{align-items:flex-start;}
  .ex .i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--fill);font-size:12px;font-weight:600;display:grid;place-items:center;color:var(--label2);margin-top:1px;font-variant-numeric:tabular-nums;}
  .ex .n{flex:1;min-width:0;}
  .ex .r b{display:block;font-size:16px;}
  .ex .r span{font-size:13px;color:var(--label2);}
  .vids{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .vid{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:100px;padding:4px 11px 4px 8px;}
  .vid svg{width:13px;height:13px;fill:currentColor;}
  button.vid{border:0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .vid.tmr{color:var(--off);background:color-mix(in srgb,var(--off) 14%,transparent);}
  .vid.tmr svg,.vid.lg svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .vid.lg{color:var(--on);background:color-mix(in srgb,var(--on) 14%,transparent);}
  .vid.lg.open{color:var(--card);background:var(--on);}
  .exw{position:relative;}
  .exw+.exw::before{content:'';position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep);}
  .log{padding:0 16px 14px 52px;}
  .log-h{font-size:13px;font-weight:700;color:var(--label);margin:10px 0 2px;}
  .log .hint{font-size:13px;color:var(--label2);margin:0 0 6px;line-height:1.4;}
  .log .hint.up{color:var(--on);font-weight:600;}
  .set{display:flex;align-items:center;gap:8px;padding:3px 0;}
  .set .si{flex:none;width:16px;font-size:13px;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums;}
  .set label{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:var(--fill);border-radius:11px;padding:0 10px;font-size:13px;color:var(--label2);}
  .set input{width:100%;min-width:0;border:0;background:none;font:inherit;font-size:17px;font-weight:600;color:var(--label);padding:7px 0;outline:none;font-variant-numeric:tabular-nums;}
  .set input::placeholder{color:var(--label3);font-weight:500;}
  .set .ok{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--label3);background:none;display:grid;place-items:center;cursor:pointer;}
  .set.saved .ok{background:var(--on);border-color:var(--on);}
  .set.saved .ok::after{content:'';width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg);}
  .set.miss label{box-shadow:inset 0 0 0 1.5px var(--off);}
  .addset{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--accent);padding:6px 0 0;cursor:pointer;}
  .up{color:var(--on);font-weight:600;} .down{color:var(--off);font-weight:600;}
  .spark{display:block;width:100%;height:44px;margin:4px 0 8px;}
  .wkl div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;}
  .wkl div+div{border-top:.5px solid var(--sep);}
  .wkl .num{color:var(--label2);text-align:right;}

  /* timer */
  #timer{position:fixed;z-index:49;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 76px);width:calc(100% - 32px);max-width:420px;border-radius:22px;overflow:hidden;background:var(--bar);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(0,0,0,.18);}
  #timer[hidden]{display:none;}
  .t-in{display:flex;align-items:center;gap:6px;padding:9px 9px 9px 16px;}
  .t-l{flex:1;min-width:0;font-size:12px;color:var(--label2);}
  #t-ex{display:block;font-size:14px;font-weight:600;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #t-time{font-family:var(--round);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-right:4px;}
  .t-b{flex:none;border:0;background:var(--fill);color:var(--label);font:inherit;font-size:14px;font-weight:600;border-radius:100px;height:36px;min-width:40px;padding:0 9px;cursor:pointer;}
  .t-bar{height:4px;background:var(--fill);}
  #t-fill{height:100%;background:var(--off);transition:width .3s linear;}
  #timer.done{background:color-mix(in srgb,var(--on) 25%,var(--card));}
  #timer.done #t-fill{background:var(--on);}
  body.timing .wrap{padding-bottom:calc(180px + env(safe-area-inset-bottom));}
  .lift .goal{color:var(--on);font-weight:600;font-size:15px;}

  /* week */
  .wk .d{width:40px;flex:none;font-weight:600;color:var(--label2);font-size:14px;}
  .wk .w{flex:1;}
  .wk.rest .w{color:var(--label2);}
  .pill{font-size:12px;font-weight:700;border-radius:100px;padding:3px 9px;letter-spacing:.02em;}
  .pill.on{color:var(--on);background:color-mix(in srgb,var(--on) 15%,transparent);}
  .pill.off{color:var(--off);background:color-mix(in srgb,var(--off) 15%,transparent);}
  .pill.opt{color:var(--label2);background:var(--fill);}

  /* table */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.03em;text-align:right;padding:12px 16px 6px;}
  th:first-child,td:first-child{text-align:left;}
  td{padding:10px 16px;text-align:right;border-top:.5px solid var(--sep);}
  tfoot td{font-weight:700;font-family:var(--round);font-size:17px;}
  .c-on{color:var(--on);} .c-off{color:var(--off);}

  .note{border-radius:22px;padding:16px;background:color-mix(in srgb,var(--accent) 10%,var(--card));font-size:14px;line-height:1.5;color:var(--label2);margin-top:12px;}
  .note h4{font-size:16px;color:var(--label);margin-bottom:4px;letter-spacing:-.01em;}
  .note b{color:var(--label);}

  /* tab bar */
  .tabbar{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 6px);width:calc(100% - 32px);max-width:420px;display:flex;padding:5px;border-radius:100px;background:var(--bar);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgba(0,0,0,.18);}
  .tabbar button{flex:1;border:0;background:none;font:inherit;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:100px;cursor:pointer;font-size:10px;font-weight:600;transition:background .2s,color .2s;}
  .tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tabbar button.on{color:var(--accent);background:var(--fill);}

  /* lista spesa */
  #shop-list .card:first-child{margin-top:12px;}
  .chk{cursor:pointer;user-select:none;-webkit-user-select:none;}
  .chk .box{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--label3);display:grid;place-items:center;transition:background .15s,border-color .15s;}
  .chk.done .box{background:var(--on);border-color:var(--on);}
  .chk.done .box::after{content:'';width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg);}
  .chk .n{flex:1;min-width:0;}
  .chk.done .n{color:var(--label3);text-decoration:line-through;}
  .chk .q{font-variant-numeric:tabular-nums;color:var(--label2);white-space:nowrap;font-size:14px;}
  .chk.done .q{color:var(--label3);}
  .chk .del{flex:none;border:0;background:var(--fill);color:var(--label2);width:26px;height:26px;border-radius:50%;font:inherit;font-size:17px;line-height:1;cursor:pointer;}
  .pbar{height:6px;margin:0 16px;border-radius:3px;background:var(--fill);overflow:hidden;}
  .pbar div{height:100%;background:var(--on);border-radius:3px;transition:width .25s;}
  .btn:disabled{opacity:.4;cursor:default;}
  .add-row{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px;}
  .add-row input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--label);outline:none;}
  .add-row input::placeholder{color:var(--label3);}

  /* ricette */
  #rand{margin-bottom:12px;}
  .rand-idle{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .rand-idle .sub{display:block;font-size:13px;color:var(--label2);margin-top:1px;}
  .btn{flex:none;border:0;font:inherit;font-size:15px;font-weight:600;color:var(--card);background:var(--accent);border-radius:100px;padding:10px 18px;cursor:pointer;white-space:nowrap;}
  .btn.sec{color:var(--label);background:var(--fill);}
  .btns{display:flex;gap:8px;padding:0 16px 16px;}
  summary .r.mut{font-size:13px;}
  .ing{border-radius:14px;background:var(--fill);padding:2px 12px;margin:2px 0 12px;}
  .ing div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;color:var(--label);}
  .ing div+div{border-top:.5px solid var(--sep);}
  .ing .num{color:var(--label2);white-space:nowrap;text-align:right;}
  .dbody ol{list-style:none;counter-reset:s;}
  .dbody ol li{counter-increment:s;padding-left:28px;margin-top:8px;}
  .dbody ol li::before{content:counter(s);top:1px;left:0;width:20px;height:20px;border-radius:50%;background:var(--fill);color:var(--label2);font-size:11px;font-weight:700;display:grid;place-items:center;}
  .dbody .tip{margin-top:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--off) 13%,transparent);}
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Ripartenza · 26/27</div>
  <h1 id="title">Piano</h1>

  <section class="view" id="v-piano"></section>
  <section class="view" id="v-dieta"></section>
  <section class="view" id="v-ricette"></section>
  <section class="view" id="v-allenamento"></section>
  <section class="view" id="v-spesa"></section>
</div>

<div id="timer" hidden role="timer" aria-live="polite">
  <div class="t-in">
    <span class="t-l"><span id="t-st">Recupero</span><span id="t-ex"></span></span>
    <b id="t-time">0:00</b>
    <button class="t-b" id="t-minus" aria-label="Togli 15 secondi">−15</button>
    <button class="t-b" id="t-plus" aria-label="Aggiungi 15 secondi">+15</button>
    <button class="t-b" id="t-x" aria-label="Chiudi timer">✕</button>
  </div>
  <div class="t-bar"><div id="t-fill"></div></div>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="piano"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Piano</button>
  <button data-tab="dieta"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 1-2 2v0M7 3v8a2 2 0 0 0 2 2M5 3v5M9 3v5M7 13v8"/><path d="M17 21V3c-2.2 1-3.5 3.6-3.5 7v3h3.5"/></svg>Dieta</button>
  <button data-tab="ricette"><svg viewBox="0 0 24 24"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 11h20"/><path d="M9.5 7.5c0-1.5 1-2 1-3.5M14 7.5c0-1.5 1-2 1-3.5"/></svg>Ricette</button>
  <button data-tab="allenamento"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Allenamento</button>
  <button data-tab="spesa"><svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.3 11h10.8l2.2-8H6.3"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>Spesa</button>
</nav>

  ['Cena di emergenza, zero preparazione', `Merluzzo o platessa surgelati in forno a 220 °C per 20 min (vanno anche da congelati), verdure surgelate in padella e pane dal freezer. Olio pesato a crudo. Basta tenere sempre una busta di ciascuno.`],
];

const KITCHEN = [
  ["L'olio si pesa, sempre", `La regola più importante. Versato dalla bottiglia, 10 g diventano facilmente 30 g: <b>180 kcal in più</b> senza accorgertene. Mettilo in un cucchiaio sulla bilancia.`],
  ['Olio a crudo, alla fine', `Cuoci in padella antiaderente ben calda unta con lo spray (o con un dito d'acqua) e aggiungi il resto col cucchiaio sul piatto pronto. Più sapore, stessi grammi.`],
  ["Lo spray per l'olio", `Il tuo spray fa <b>0,1 g a spruzzo</b>: 10 spruzzi = 1 g, quindi 10 g sarebbero 100 spruzzi. Usalo per <b>ungere</b> padella, teglia e friggitrice ad aria: <ul><li><b>padella:</b> 10–20 spruzzi (1–2 g)</li><li><b>teglia di patate o verdure:</b> 20–30 spruzzi (2–3 g), poi gira bene</li></ul>L'olio <b>a crudo</b> sul piatto va col cucchiaio sulla bilancia. Il conto è semplice: <b>dose del pasto − quello spruzzato = olio a crudo</b>. Premi sempre fino in fondo, non riempirlo oltre i 90 ml e ogni 2–3 settimane sciacqualo con acqua calda e aceto, sennò si intasa.`],
  ['Niente fritto e niente impanato', `Pastella e panatura assorbono olio come spugne: una cotoletta può avere il doppio delle calorie del petto da cui parte. La <b>friggitrice ad aria</b> va bene, con 10–20 spruzzi d'olio (1–2 g).`],
  ['I sughi "nascosti"', `Panna, burro, pesto pronto, maionese e formaggi fusi sono quasi tutto grasso. Usa passata, limone, senape, aceto balsamico, spezie ed erbe: praticamente zero calorie.`],
  ['Crudo o cotto?', `Il piano pesa a crudo. Se ti capita di pesare il cotto: <ul><li><b>pasta</b> 80 g cruda ≈ 180–200 g cotta</li><li><b>riso</b> 80 g crudo ≈ 220–240 g cotto</li><li><b>pollo</b> 150 g crudo ≈ 110 g cotto</li></ul>`],
  ['Il sale', `Non fa ingrassare, ma trattiene acqua: dopo una cena salata la bilancia può segnare +0,5 kg che non sono grasso. Moderazione, e spezie al posto del sale: <b>aglio in granuli e paprika</b> (anche affumicata) su quasi tutto, poi rosmarino, origano, curry.`],
  ['Pollo morbido', `Fette sottili: 3–4 min per lato in padella. Ben cotto dentro, senza parti rosa, ma non oltre: è così che diventa stopposo.`],
];

const BATCH = `<ul><li><b>Pollo:</b> 1 kg di petti a fette con spezie e limone, 200 °C per 18–20 min. Pesalo prima di cuocerlo e dividilo in porzioni da 150 g crude.</li><li><b>Carbo:</b> un pentolone di riso o farro. Scolalo, stendilo su un piatto per raffreddarlo in fretta e mettilo in frigo <b>entro un paio d'ore</b>.</li><li><b>Verdure:</b> una teglia di zucchine, peperoni e melanzane grigliate, senza olio, e una padella di fagiolini o spinaci con aglio in granuli. L'olio si aggiunge pesato quando mangi.</li><li><b>Conservazione:</b> in frigo 3 giorni. Per giovedì e venerdì congela le porzioni.</li></ul>`;

const $ = s => document.querySelector(s);
const fmt = (n, d = 0) => n.toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: 'always' });
const store = {
  get(k, d) { try { return localStorage.getItem('rp.' + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('rp.' + k, v); } catch {} },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const load = (k, d) => { try { return JSON.parse(store.get(k, '')) || d; } catch { return d; } };
const toDate = s => new Date(s + 'T00:00:00');
const daysBetween = (a, b) => Math.round((b - a) / 864e5); // arrotonda per l'ora legale
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

function seg(id, labels, active, cls = '') {
  return `<div class="seg ${cls}" id="${id}" style="--n:${labels.length};--i:${active}">${labels.map((l, i) => `<button data-i="${i}" class="${i == active ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}
function bindSeg(id, onChange) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    el.style.setProperty('--i', b.dataset.i);
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    onChange(+b.dataset.i);
  });
}
const disclosure = (title, body, open = false) => `<details${open ? ' open' : ''}><summary>${title}</summary><div class="dbody">${body}</div></details>`;
const foodRows = foods => foods.map(([n, q, note]) => `<div class="row food"><span class="n">${n}${note ? ` <small>· ${note}</small>` : ''}</span><span class="q">${q}</span></div>`).join('');

/* ---------- Piano ---------- */
function renderPiano() {
  const start = toDate(BLOCK.start), now = new Date();
  const day = daysBetween(start, new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  const week = Math.min(BLOCK.weeks, Math.max(1, Math.floor(day / 7) + 1));
  const done = day >= BLOCK.weeks * 7, before = day < 0;

  const pts = BLOCK.route.map(([d, kg, l]) => ({ t: daysBetween(start, toDate(d)), kg, l }));
  const ks = pts.map(p => p.kg), hi = Math.max(...ks), lo = Math.min(...ks), pad = (hi - lo) * .12;
  const goal = pts.at(-1).kg, T = pts.at(-1).t, W = 320, H = 110, x = t => 6 + (t / T) * (W - 12), y = kg => 10 + (hi + pad - kg) / (hi - lo + 2 * pad) * (H - 34);
  const t = Math.max(0, Math.min(T, day));
  let i = pts.findIndex(p => p.t >= t); if (i <= 0) i = 1;
  const a = pts[i - 1], b = pts[i], kgNow = a.kg + (b.kg - a.kg) * ((t - a.t) / (b.t - a.t || 1));
  const line = pts.map(p => `${x(p.t).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  const past = pts.filter(p => p.t <= t).map(p => `${x(p.t).toFixed(1)},${y(p.kg).toFixed(1)}`).concat(`${x(t).toFixed(1)},${y(kgNow).toFixed(1)}`).join(' ');
  const nextDeload = BLOCK.deloads.find(w => w >= week);
  const deloadStart = nextDeload && addDays(start, (nextDeload - 1) * 7);
  const isDeload = BLOCK.deloads.includes(week) && !done && !before;
  const cap = s => s[0].toUpperCase() + s.slice(1);

  $('#v-piano').innerHTML = `
    <div class="card">
      <div class="pad">
        <div class="kicker">${done ? 'Blocco concluso' : before ? `Si parte ${start.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })}` : isDeload ? cap(BLOCK.deloadLabel) : BLOCK.kicker}</div>
        <div class="hero-top">
          ${before ? `<div class="big">${-day}<small> ${day === -1 ? 'giorno' : 'giorni'} al via</small></div>` : `<div class="big">Sett. ${week}<small> / ${BLOCK.weeks}</small></div>`}
          <div style="text-align:right"><div class="kicker" style="margin:0">${before ? 'si parte da' : 'rotta di oggi'}</div><div class="big" style="font-size:28px">${before ? '' : '~'}${fmt(kgNow, kgNow % 1 ? 1 : 0)}<small style="font-size:15px"> kg</small></div></div>
        </div>
        <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rotta del peso da ${fmt(pts[0].kg)} a ${fmt(goal)} kg">
          <line x1="6" x2="${W - 6}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--sep)" stroke-dasharray="3 4"/>
          <polyline points="${line}" fill="none" stroke="var(--label3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="${past}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.kg)}" r="2.5" fill="${p.t <= t ? 'var(--accent)' : 'var(--label3)'}"/>`).join('')}
          <circle cx="${x(t)}" cy="${y(kgNow)}" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2.5"/>
          ${pts.map(p => `<text x="${x(p.t)}" y="${H - 4}" text-anchor="middle">${p.l}</text>`).join('')}
          ${pts.filter((p, k) => k === 0 || k === pts.length - 1).map(p => `<text x="${x(p.t)}" y="${y(p.kg) - 9}" text-anchor="${p.t ? 'end' : 'start'}" style="fill:var(--label)">${fmt(p.kg, p.kg % 1 ? 1 : 0)}</text>`).join('')}
        </svg>
      </div>
      <div class="chips">${BLOCK.stats.map(([l, v]) => `<div><span>${l}</span><b>${v}</b></div>`).join('')}</div>
    </div>
    ${nextDeload && !done ? `<div class="card"><div class="row"><span>${isDeload ? `${cap(BLOCK.deloadLabel)} in corso` : `Prossima ${BLOCK.deloadLabel}`}<span class="sub">${BLOCK.deloadText}</span></span><span class="r">${isDeload ? `sett. ${week}` : `sett. ${nextDeload} · ${deloadStart.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' })}`}</span></div></div>` : ''}

    <h2>Come partire</h2>
    <div class="card">${START.map(([t, b], k) => disclosure(t, b, k === 0 && (before || week <= 2))).join('')}</div>

    <h2>Misure</h2>
    <div class="card">${BLOCK.measures.map(([n, sub, now, goal]) => `<div class="row"><span>${n}${sub ? `<span class="sub">${sub}</span>` : ''}</span><span class="r"><b>${now}</b><span class="sub">${goal}</span></span></div>`).join('')}</div>
    <p class="foot">Rimisura tutto ogni lunedì mattina, a digiuno. La vita col metro all'altezza dell'ombelico, pancia rilassata, senza stringere.</p>

    <h2>Energia</h2>
    <div class="card">${BLOCK.energy.map(([l, v]) => `<div class="row"><span>${l}</span><span class="r mut">${v}</span></div>`).join('')}</div>
    <p class="foot">${BLOCK.energyNote}</p>
    <div class="note"><h4>La leva: come regolare</h4>${LEVER}</div>

    <h2>Settimana tipo</h2>
    <div style="margin-bottom:10px">${seg('seg-week', WEEK.options.map(o => o.name), store.get('cal', 0))}</div>
    <div class="card" id="week-list"></div>
    <p class="foot">${WEEK.intro} ${WEEK.note}</p>

    <h2>Regole fondamentali</h2>
    <div class="card">${RULES.map(([t, b]) => disclosure(t, b)).join('')}</div>

    <h2>Note strategiche</h2>
    <div class="card">${STRATEGY.map(([t, b]) => disclosure(t, b)).join('')}</div>`;

  const renderWeek = k => {
    $('#week-list').innerHTML = WEEK.options[k].days.map(([d, w, s]) =>
      `<div class="row wk ${s === 'off' ? 'rest' : ''}"><span class="d">${d}</span><span class="w">${w}</span><span class="pill ${s}">${s === 'opt' ? 'OFF/ON' : s.toUpperCase()}</span></div>`).join('');
  };
  renderWeek(+store.get('cal', 0));
  bindSeg('seg-week', k => { store.set('cal', k); renderWeek(k); });
}

/* ---------- Dieta ---------- */
function macroLine({ p, c, g }) {
  const tot = p * 4 + c * 4 + g * 9;
  return `<div class="mline"><span><span class="dot" style="background:var(--p)"></span><b>${p}</b> P</span><span><span class="dot" style="background:var(--c)"></span><b>${c}</b> C</span><span><span class="dot" style="background:var(--g)"></span><b>${g}</b> G</span>
    <span class="split"><div style="width:${p * 4 / tot * 100}%;background:var(--p)"></div><div style="width:${c * 4 / tot * 100}%;background:var(--c)"></div><div style="width:${g * 9 / tot * 100}%;background:var(--g)"></div></span></div>`;
}
function mealCard(m, key) {
  const approx = m.approx ? '~' : '';
  let body;
  if (m.variants) {
    const vi = +store.get('bf', 0);
    body = `<div class="inner-seg">${seg('seg-' + key, m.variants.map(v => v.name), vi, 'sm')}</div><div id="var-${key}"></div>`;
  } else {
    body = foodRows(m.foods) + disclosure('Preparazione', m.prep);
  }
  const tips = (m.tips || []).map(([t, b]) => disclosure(t, b)).join('');
  return `<div class="card">
    <div class="meal-h"><div><h3>${m.name}</h3><div class="sub">${m.when}</div></div><div class="kcal">${approx}${fmt(m.kcal)}<small> kcal</small></div></div>
    ${macroLine(m)}
    ${body}${tips}
  </div>`;
}
function renderVariant(m, key, vi) {
  const v = m.variants[vi];
  document.getElementById('var-' + key).innerHTML = `<div class="row" style="min-height:0;padding:2px 16px 6px"><span class="vmeta" style="margin:0;text-align:left">${v.name}: ${v.kcal} kcal · P${v.p} · C${v.c} · G${v.g}</span></div>` + foodRows(v.foods) + disclosure('Preparazione', v.prep);
}
function renderDieta() {
  const k = +store.get('day', 0);
  $('#v-dieta').innerHTML = `
    <div class="sticky">${seg('seg-day', [DAYS.on.label, DAYS.off.label], k)}</div>
    <div id="day-body"></div>

    <h2>Costruisci il piatto</h2>
    <p class="foot" style="margin:-4px 4px 10px">${BUILDER.intro}</p>
    ${BUILDER.groups.map(g => `<div class="card"><div class="row"><b>${g.title}</b><span class="r mut" style="font-size:13px">${g.head}</span></div>${g.items.map(([n, q]) => `<div class="row food"><span>${n}</span><span class="q">${q}</span></div>`).join('')}</div>`).join('')}
    <div class="card">${disclosure('Combo già pronte', `<ul>${BUILDER.combos.map(c => `<li>${c}</li>`).join('')}</ul>`)}</div>

    <h2>Le tue verdure</h2>
    <div class="card">${VEG.rows.map(([l, v], k) => `<div class="row"><span>${l}<span class="sub"${k === VEG.rows.length - 1 ? ' style="text-decoration:line-through"' : ''}>${v}</span></span></div>`).join('')}</div>
    <div class="card">${VEG.tips.map(([t, b]) => disclosure(t, b)).join('')}</div>

    <h2>Consigli</h2>
    <div class="card">
      ${disclosure('Mangiare meno senza fare la fame', EAT_TIPS)}
      ${disclosure(FREE_MEAL.title, `<p>${FREE_MEAL.text}</p>`)}
    </div>`;

  const renderDay = i => {
    const key = i ? 'off' : 'on', d = DAYS[key];
    const max = Math.max(d.p * 4, d.c * 4, d.g * 9);
    $('#day-body').innerHTML = `
      <div class="card pad tone-${key}">
        <div class="kicker">${d.meta}</div>
        <div class="day-sum">
          <div class="big">${fmt(d.kcal)}<small> kcal</small></div>
          <div class="macros">
            ${[['P', d.p, 4, 'p'], ['C', d.c, 4, 'c'], ['G', d.g, 9, 'g']].map(([l, v, f, c]) => `<div class="mrow" style="--m:var(--${c})"><i>${l}</i><div class="track"><div style="width:${v * f / max * 100}%"></div></div><span>${v} g</span></div>`).join('')}
          </div>
        </div>
      </div>
      <h2>Pasti</h2>
      ${d.meals.map((m, j) => mealCard(m, key + j)).join('')}`;
    d.meals.forEach((m, j) => {
      if (!m.variants) return;
      const id = key + j;
      renderVariant(m, id, +store.get('bf', 0));
      bindSeg('seg-' + id, vi => { store.set('bf', vi); renderVariant(m, id, vi); });

  renderDay(k);
  bindSeg('seg-day', i => { store.set('day', i); renderDay(i); });

const recipeBody = r => `<div class="dbody">
  <div class="ing">${r.foods.map(([n, q, note]) => `<div><span>${n}${note ? ` <i>· ${note}</i>` : ''}</span><span class="num">${q}</span></div>`).join('')}</div>
  <ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>
  ${r.tip ? `<p class="tip">${r.tip}</p>` : ''}
</div>`;
function renderRicette() {
  const F = ['Tutte', 'Pranzo', 'Cena'];
  let f = Math.min(F.length - 1, +store.get('rf', 0)), lastR = null;

    <div class="card">${FREEZE_RULES.map(([t, b]) => disclosure(t, b)).join('')}</div>

    $('#rand').innerHTML = `<div class="card pad rand-idle"><div><b>Non sai cosa cucinare?</b><span class="sub">${f ? `Ne pesco una per ${F[f].toLowerCase()}` : 'Ne pesco una tra tutte'}</span></div><button class="btn" id="roll">Ricetta a caso</button></div>`;

    lastR = r;
    $('#rand').innerHTML = `<div class="card">
      <div class="wo-h"><span class="tag">Ricetta a caso</span><h3>${r.name}</h3><p>${recipeSub(r)} · ${r.time}</p></div>

      <div class="btns"><button class="btn" id="roll">Un'altra</button><button class="btn sec" id="unroll">Chiudi</button></div>

  const renderList = () => {
    $('#rec-list').innerHTML = list().map(r => `<details><summary><span>${r.name}<span class="sub">${recipeSub(r)}</span></span><span class="r mut">${r.time.split(' · ')[0]}</span></summary>${recipeBody(r)}</details>`).join('');
  };

/* ---------- Allenamento ---------- */
// Video: il 5° campo di un esercizio può essere un testo da cercare su YouTube,
// un link diretto a un video (https://...), oppure una lista di [etichetta, testo o link].
const videoUrl = q => q.startsWith('http') ? q : 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q + ' esecuzione corretta');
const videoLinks = (name, vid) => (Array.isArray(vid) ? vid : [['Video', vid || name]]).map(([l, q]) =>
  `<a class="vid" href="${videoUrl(q)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>${l}</a>`).join('');

// "2′" → 120, "90″" → 90 · "3×10–12" → 3 serie, massimo 12
const restSec = s => { const m = /(\d+)\s*([′″])/.exec(s); return m ? +m[1] * (m[2] === '′' ? 60 : 1) : 0; };
const setCount = s => +((/^(\d+)×/.exec(s) || [])[1] || 3);
const topReps = s => +((/×(?:\d+–)?(\d+)/.exec(s) || [])[1] || 0);
const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const restLabel = s => s >= 60 && s % 60 === 0 ? `${s / 60}′` : `${s}″`;
const dkey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const planWeek = d => Math.max(0, Math.floor(daysBetween(toDate(BLOCK.start), toDate(d)) / 7) + 1);
const weekName = w => w ? `Sett. ${w}` : 'Prima del via';
const ICON_CLOCK = '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg>';
const ICON_PEN = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>';

// Registro: { esercizio: { 'AAAA-MM-GG': [[kg | null, ripetizioni], …] } } salvato sul telefono
const LOG = {
  data: load('log', {}),
  save() { store.set('log', JSON.stringify(this.data)); },
  day(n, d = dkey()) { return (this.data[n] || {})[d] || []; },
  put(n, i, v, d = dkey()) {
    const e = this.data[n] ??= {}, a = e[d] ??= [];
    a[i] = v;
    while (a.length && !a[a.length - 1]) a.pop();
    if (!a.length) delete e[d];
    if (!Object.keys(e).length) delete this.data[n];
    this.save();
  },
  last(n, before = dkey()) {
    const e = this.data[n] || {}, ds = Object.keys(e).filter(d => d < before).sort();
    return ds.length ? e[ds[ds.length - 1]] : null;
  },
};

// Timer di recupero: si basa sull'orario di fine, così resta giusto anche se il telefono rallenta la pagina
const Timer = (() => {
  let end = 0, total = 0, iv = 0, ctx = null, lock = null, hideT = 0;
  const el = $('#timer');
  const audio = () => { try { ctx ||= new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch {} };
  const beep = () => {
    try {
      [0, .28, .56].forEach((t, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), at = ctx.currentTime + t;
        o.frequency.value = k === 2 ? 1320 : 880;
        g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.5, at + .02); g.gain.exponentialRampToValueAtTime(.0001, at + .22);
        o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + .24);
      });
    } catch {}
    try { navigator.vibrate?.([200, 100, 200]); } catch {}
  };
  const wake = async on => {
    try { if (on) { if (!lock) lock = await navigator.wakeLock?.request('screen'); } else { await lock?.release(); lock = null; } } catch { lock = null; }
  };
  const left = () => Math.max(0, Math.ceil((end - Date.now()) / 1000));
  const draw = () => {
    const s = left();
    $('#t-time').textContent = clock(s);
    $('#t-fill').style.width = (total ? s / total * 100 : 0) + '%';
  };
  const tick = () => { draw(); if (end && !left()) finish(); };
  const finish = () => {
    clearInterval(iv); end = 0; beep(); wake(false);
    el.classList.add('done'); $('#t-st').textContent = 'Recupero finito';
    $('#t-time').textContent = 'Via!'; $('#t-fill').style.width = '100%';
    hideT = setTimeout(stop, 6000);
  };
  const stop = () => { clearInterval(iv); clearTimeout(hideT); end = 0; el.hidden = true; el.classList.remove('done'); document.body.classList.remove('timing'); wake(false); };
  const start = (sec, name) => {
    audio(); clearInterval(iv); clearTimeout(hideT);
    total = sec; end = Date.now() + sec * 1000;
    el.classList.remove('done'); el.hidden = false; document.body.classList.add('timing');
    $('#t-st').textContent = 'Recupero'; $('#t-ex').textContent = name;
    draw(); iv = setInterval(tick, 250); wake(true);
  };
  const add = s => { if (!end) return; end = Math.max(Date.now() + 1000, end + s * 1000); total = Math.max(total, left()); draw(); };
  $('#t-plus').onclick = () => add(15);
  $('#t-minus').onclick = () => add(-15);
  $('#t-x').onclick = stop;
  document.addEventListener('visibilitychange', () => { if (!document.hidden && end) { tick(); if (end) wake(true); } });
  return { start };
})();

const fmtKg = kg => fmt(kg, kg % 1 ? 1 : 0);
const fmtSet = ([kg, r], time) => `${kg != null ? fmtKg(kg) + ' kg × ' : ''}${r}${time ? '″' : kg != null ? '' : ' rip'}`;
const better = (a, b) => !b || (a[0] ?? 0) > (b[0] ?? 0) || ((a[0] ?? 0) === (b[0] ?? 0) && a[1] > b[1]);

function renderAllenamento() {
  const k = Math.min(WORKOUTS.length - 1, +store.get('wo', 0));
  $('#v-allenamento').innerHTML = `
    <div class="sticky">${seg('seg-wo', WORKOUTS.map(w => w.short), k, 'sm')}</div>
    <div id="wo-body"></div>

    <h2>Progressi</h2>
    <div id="prog"></div>

    <h2>Le fasi</h2>
    <div class="card">${PHASES.map(([n, wk, s, note]) => `<details class="lift"><summary><span>${n}<span class="sub">${wk}</span></span><span class="r goal">${s}</span></summary><div class="dbody">${note}</div></details>`).join('')}</div>
    <p class="foot">Il primo giorno serve a trovare i carichi: scegli un peso con cui faresti 15 ripetizioni pulite e fanne 10-12. Se era troppo leggero, sali la volta dopo.</p>

    <h2>Progressione</h2>
    <div class="card">
      ${PROGRESSION.map(([t, b]) => disclosure(t, b)).join('')}
      ${disclosure('Perché questo programma', PHILOSOPHY)}
    </div>

    <h2>Palestra piena? Piano B</h2>
    <p class="foot" style="margin:-4px 4px 10px">${PLAN_B.intro}</p>
    <div class="card">${PLAN_B.items.map(([t, alts]) => disclosure(t, `<ul>${alts.map(a => `<li>${a}</li>`).join('')}</ul>`)).join('')}</div>
    <p class="foot">${PLAN_B.rule}</p>`;

  let cur = k;
  const open = new Set(), extra = {};
  const exOf = j => {
    const [n, aim, sets, rest, vid, o = {}] = WORKOUTS[cur].ex[j];
    return { n, aim, sets, restTxt: rest, vid, rest: restSec(rest), parts: o.parts || [n], bw: !!o.bw, time: sets.includes('″'), want: setCount(sets), top: topReps(sets) };
  };
  const doneCount = e => Math.min(...e.parts.map(p => LOG.day(p).filter(Boolean).length));
  const panel = (e, j) => e.parts.map((p, pi) => {
    const today = LOG.day(p), last = LOG.last(p), prev = last ? last.filter(Boolean) : [];
    const rows = Math.max(e.want, today.length, extra[p] || 0);
    const up = prev.length >= e.want && e.top && prev.every(s => s[1] >= e.top);
    const hint = !prev.length ? (e.bw ? 'Prima volta: segna le ripetizioni che fai.' : 'Prima volta: segna il peso che usi.')
      : up ? `Ultima volta tutte a ${e.top}${e.time ? '″' : ''}: ${e.bw ? 'oggi rendila un po\' più difficile' : 'oggi sali di carico, del minimo possibile, e riparti dal fondo del range'}.`
      : `Ultima volta: ${prev.map(s => fmtSet(s, e.time)).join(' · ')}`;
    let html = `${e.parts.length > 1 ? `<div class="log-h">${esc(p)}</div>` : ''}<p class="hint${up ? ' up' : ''}">${hint}</p>`;
    for (let i = 0; i < rows; i++) {
      const s = today[i], l = (last && last[i]) || prev[prev.length - 1];
      html += `<div class="set${s ? ' saved' : ''}" data-p="${esc(p)}" data-pi="${pi}" data-i="${i}"><span class="si">${i + 1}</span>
        ${e.bw ? '' : `<label><input class="kg" inputmode="decimal" autocomplete="off" value="${s && s[0] != null ? fmtKg(s[0]) : ''}" placeholder="${l && l[0] != null ? fmtKg(l[0]) : ''}" aria-label="Chili, serie ${i + 1}">kg</label>`}
        <label><input class="rp" inputmode="numeric" autocomplete="off" value="${s ? s[1] : ''}" placeholder="${l ? l[1] : ''}" aria-label="${e.time ? 'Secondi' : 'Ripetizioni'}, serie ${i + 1}">${e.time ? 'sec' : 'rip'}</label>
        <button class="ok" aria-label="Serie ${i + 1} fatta"></button></div>`;
    }
    return html + `<button class="addset" data-p="${esc(p)}">+ Aggiungi serie</button>`;
  }).join('');
  const exHTML = j => {
    const e = exOf(j), id = cur + '-' + j, on = open.has(id);
    return `<div class="exw" data-j="${j}"><div class="row ex"><span class="i">${j + 1}</span><span class="n">${e.n}<span class="sub">${e.aim}</span><span class="vids">${videoLinks(e.n, e.vid)}<button class="vid tmr" data-j="${j}" aria-label="Avvia recupero ${restLabel(e.rest)}">${ICON_CLOCK}${restLabel(e.rest)}</button><button class="vid lg${on ? ' open' : ''}" data-j="${j}" aria-expanded="${on}">${ICON_PEN}Serie ${doneCount(e)}/${e.want}</button></span></span><span class="r"><b>${e.sets}</b><span>rec ${e.restTxt}</span></span></div>${on ? `<div class="log">${panel(e, j)}</div>` : ''}</div>`;
  };
  const redraw = j => { const box = $(`#wo-body .exw[data-j="${j}"]`); if (box) box.outerHTML = exHTML(j); };
  const renderWo = i => {
    cur = i;
    const w = WORKOUTS[i];
    $('#wo-body').innerHTML = `<div class="card">
      <div class="wo-h"><span class="tag">${w.tag}</span><h3>${w.title}</h3><p>${w.focus}</p></div>
      ${w.cardio
        ? w.ex.map(([n, aim, sets, rest], j) => `<div class="row ex"><span class="i">${j + 1}</span><span class="n">${n}<span class="sub">${aim}</span></span><span class="r"><b>${sets}</b><span>${rest}</span></span></div>`).join('')
        : w.ex.map((_, j) => exHTML(j)).join('')}
    </div>${w.cardio ? '' : `<p class="foot">Tocca <b>Serie</b> per segnare peso e ripetizioni: con la spunta parte il recupero. Se rifai lo stesso dell'ultima volta basta la spunta, vale il numero in grigio. Il pulsante arancione fa partire solo il timer.</p>`}${w.note ? `<p class="foot">${w.note}</p>` : ''}`;
  };

  const renderProg = () => {
    const metas = [];
    WORKOUTS.filter(w => !w.cardio).forEach(w => w.ex.forEach(([n, , sets, , , o = {}]) =>
      (o.parts || [n]).forEach(p => { if (!metas.some(m => m.p === p)) metas.push({ p, time: sets.includes('″') }); })));
    const weeks = {};
    for (const days of Object.values(LOG.data)) for (const [d, a] of Object.entries(days)) {
      const o = weeks[planWeek(d)] ??= { days: new Set(), sets: 0, vol: 0 };
      o.days.add(d);
      for (const s of a) if (s) { o.sets++; if (s[0] != null) o.vol += s[0] * s[1]; }
    }
    const cw = planWeek(dkey()), now = weeks[cw] || { days: new Set(), sets: 0, vol: 0 }, before = weeks[cw - 1];
    const pct = before && before.vol && now.vol ? Math.round((now.vol / before.vol - 1) * 100) : null;
    const since = cw ? `dal ${addDays(toDate(BLOCK.start), (cw - 1) * 7).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' })}` : 'prima dell\'inizio del programma';
    let html = `<div class="card">
      <div class="row"><span>${weekName(cw)}<span class="sub">${since}</span></span>${pct != null ? `<span class="r"><span class="${pct >= 0 ? 'up' : 'down'}">${pct >= 0 ? '+' : '−'}${Math.abs(pct)}%</span><span class="sub">volume vs sett. prima</span></span>` : ''}</div>
      <div class="chips" style="grid-template-columns:repeat(3,1fr)"><div><span>Sedute</span><b>${now.days.size}</b></div><div><span>Serie</span><b>${now.sets}</b></div><div><span>Volume</span><b>${fmt(Math.round(now.vol))}<small style="font-size:12px"> kg</small></b></div></div>
    </div>`;
    const ex = metas.filter(m => LOG.data[m.p]).map(({ p, time }) => {
      const byW = {};
      for (const [d, a] of Object.entries(LOG.data[p])) {
        const o = byW[planWeek(d)] ??= { best: null, sets: 0 };
        for (const s of a) if (s) { o.sets++; if (better(s, o.best)) o.best = s; }
      }
      const ws = Object.keys(byW).map(Number).sort((a, b) => a - b), lw = ws[ws.length - 1], pw = ws[ws.length - 2];
      const b = byW[lw].best;
      let delta = 'nuovo', cls = 'mut';
      if (pw !== undefined) {
        const a = byW[pw].best, dk = (b[0] ?? 0) - (a[0] ?? 0), dr = b[1] - a[1];
        const v = dk || dr;
        delta = v ? `${v > 0 ? '+' : '−'}${dk ? fmtKg(Math.abs(dk)) + ' kg' : Math.abs(dr) + (time ? '″' : ' rip')}` : '=';
        cls = v > 0 ? 'up' : v < 0 ? 'down' : 'mut';
      }
      const vals = ws.map(w => byW[w].best[0] ?? byW[w].best[1]);
      let spark = '';
      if (ws.length > 1) {
        const hi = Math.max(...vals), lo = Math.min(...vals), X = i => 8 + i / (vals.length - 1) * 284, Y = v => hi === lo ? 22 : 36 - (v - lo) / (hi - lo) * 28;
        spark = `<svg class="spark" viewBox="0 0 300 44" aria-hidden="true"><polyline points="${vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join('')}</svg>`;
      }
      return `<details><summary><span>${esc(p)}<span class="sub">${weekName(lw)} · migliore ${fmtSet(b, time)}</span></span><span class="r ${cls}">${delta}</span></summary><div class="dbody">${spark}<div class="wkl">${ws.slice().reverse().map(w => `<div><span>${weekName(w)}</span><span class="num">${fmtSet(byW[w].best, time)} · ${byW[w].sets} serie</span></div>`).join('')}</div></div></details>`;
    });
    html += ex.length
      ? `<div class="card">${ex.join('')}</div><p class="foot">Per ogni esercizio: la serie migliore della settimana (più peso, poi più ripetizioni) e la differenza con la settimana precedente.</p>`
      : `<div class="card pad mut" style="font-size:15px">Ancora niente da mostrare. Segna le serie con <b>Serie</b> sotto ogni esercizio e qui vedrai, settimana per settimana, come salgono pesi e ripetizioni.</div>`;
    html += `<div class="card" style="margin-top:12px"><div class="row"><span>Backup dei progressi<span class="sub">I dati restano solo su questo telefono</span></span></div><div class="btns"><button class="btn sec" id="lg-exp">Esporta</button><button class="btn sec" id="lg-imp">Importa</button></div></div>
      <p class="foot">Se togli l'icona dalla Home, iOS cancella anche i dati salvati. Prima premi <b>Esporta</b> e salva il testo (per esempio in Note), poi rimettilo con <b>Importa</b>.</p>`;
    $('#prog').innerHTML = html;
  };

  const num = (inp, int) => {
    if (!inp) return null;
    const v = (inp.value.trim() || inp.placeholder).replace(',', '.');
    const x = int ? parseInt(v, 10) : parseFloat(v);
    return Number.isFinite(x) && x >= 0 ? x : NaN;
  };
  const readSet = row => {
    const kg = num(row.querySelector('.kg')), r = num(row.querySelector('.rp'), true);
    if (Number.isNaN(kg) || !(r > 0)) return null;
    return [kg, r];
  };
  $('#wo-body').addEventListener('click', ev => {
    const t = ev.target.closest('button'); if (!t) return;
    const box = t.closest('.exw'); if (!box) return;
    const j = +box.dataset.j, e = exOf(j);
    if (t.classList.contains('tmr')) return Timer.start(e.rest, e.n);
    if (t.classList.contains('lg')) { const id = cur + '-' + j; open.has(id) ? open.delete(id) : open.add(id); return redraw(j); }
    if (t.classList.contains('addset')) { const p = t.dataset.p; extra[p] = Math.max(e.want, LOG.day(p).length, extra[p] || 0) + 1; return redraw(j); }
    if (t.classList.contains('ok')) {
      const row = t.closest('.set'), p = row.dataset.p, i = +row.dataset.i;
      if (row.classList.contains('saved')) LOG.put(p, i, null);
      else {
        const s = readSet(row);
        if (!s) { row.classList.add('miss'); const empty = [...row.querySelectorAll('input')].find(x => !x.value && !x.placeholder); (empty || row.querySelector('input')).focus(); return; }
        document.activeElement?.blur?.();
        LOG.put(p, i, s);
        if (+row.dataset.pi === e.parts.length - 1) Timer.start(e.rest, e.n);
      }
      redraw(j); renderProg();
    }
  });
  $('#wo-body').addEventListener('change', ev => {
    const row = ev.target.closest('.set.saved'); if (!row) return;
    const s = readSet(row);
    if (s) { LOG.put(row.dataset.p, +row.dataset.i, s); renderProg(); }
  });
  $('#wo-body').addEventListener('input', ev => ev.target.closest('.set')?.classList.remove('miss'));
  $('#prog').addEventListener('click', async ev => {
    if (ev.target.closest('#lg-exp')) {
      const text = JSON.stringify({ palestroxa: 1, log: LOG.data });
      try { if (navigator.share) { await navigator.share({ title: 'Backup Palestroxa', text }); return; } } catch (err) { if (err.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(text); alert('Backup copiato: incollalo in Note per tenerlo da parte.'); } catch { prompt('Copia questo testo e tienilo da parte:', text); }
    }
    if (ev.target.closest('#lg-imp')) {
      const t = prompt('Incolla qui il testo del backup:'); if (!t) return;
      try {
        const o = JSON.parse(t).log; if (!o || typeof o !== 'object') throw 0;
        let n = 0;
        for (const [ex, days] of Object.entries(o)) for (const [d, a] of Object.entries(days)) if (/^\d{4}-\d\d-\d\d$/.test(d) && Array.isArray(a)) { (LOG.data[ex] ??= {})[d] = a; n++; }
        LOG.save(); renderWo(cur); renderProg();
        alert(`Fatto: ${n} ${n === 1 ? 'seduta ripristinata' : 'sedute ripristinate'}.`);
      } catch { alert('Questo testo non sembra un backup di Palestroxa.'); }
    }
  });

  renderWo(k); renderProg();
  bindSeg('seg-wo', i => { store.set('wo', i); renderWo(i); });
}

/* ---------- Spesa ---------- */
function renderSpesa() {
  const rows = DAYS.on.meals.map((m, i) => {
    const o = DAYS.off.meals[i];
    const name = m.name === o.name ? m.name : `${m.name} / ${o.name}`;
    return `<tr><td>${name}</td><td class="c-on">${fmt(m.kcal)}</td><td class="c-off">${fmt(o.kcal)}</td></tr>`;
  }).join('');
  const macro = d => `P ${d.p} · C ${d.c} · G ${d.g}`;
  $('#v-spesa').innerHTML = `
    <div class="card" id="shop-head"></div>
    <div id="shop-list"></div>
    <div class="card" style="margin-top:12px"><form class="add-row" id="shop-add"><input id="shop-in" placeholder="Aggiungi qualcos'altro…" autocomplete="off" enterkeyhint="done" maxlength="60"><button class="btn" type="submit">Aggiungi</button></form></div>
    <p class="foot">Tocca un prodotto per spuntarlo. Le spunte restano salvate sul telefono finché non premi <b>Nuova spesa</b>.</p>
    <div class="note"><h4>Integratori</h4>${SHOP.supplements}</div>

    <h2>Riepilogo kcal</h2>
    <div class="card">
      <table>
        <thead><tr><th>Pasto</th><th class="c-on">ON</th><th class="c-off">OFF</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>Totale</td><td class="c-on">${fmt(DAYS.on.kcal)}</td><td class="c-off">${fmt(DAYS.off.kcal)}</td></tr></tfoot>
      </table>
    </div>
    <div class="card">
      <div class="row"><span>Macro ON</span><span class="r mut">${macro(DAYS.on)}</span></div>
      <div class="row"><span>Macro OFF</span><span class="r mut">${macro(DAYS.off)}</span></div>
    </div>
    <p class="foot">${MACRO_NOTE}</p>`;

  // lista della spesa: spunte e prodotti aggiunti salvati sul telefono
  const done = new Set(load('shop', []));
  let extra = load('shopx', []);
  const save = () => { store.set('shop', JSON.stringify([...done])); store.set('shopx', JSON.stringify(extra)); };
  const key = (c, n) => c + '|' + n;
  const groups = () => SHOP.items.concat(extra.length ? [['Altro', '', extra.map(n => [n, ''])]] : []);
  const draw = () => {
    const gs = groups(), all = gs.flatMap(([c, , list]) => list.map(([n]) => key(c, n)));
    const n = all.filter(k => done.has(k)).length;
    $('#shop-head').innerHTML = `
      <div class="row"><span>Spesa settimanale<span class="sub">${SHOP.where} · ${SHOP.total}</span></span><span class="r"><b>${n} / ${all.length}</b><span class="sub">${n && n === all.length ? 'tutto preso!' : 'presi'}</span></span></div>
      <div class="pbar"><div style="width:${all.length ? n / all.length * 100 : 0}%"></div></div>
      <div class="btns" style="padding-top:12px"><button class="btn sec" id="shop-reset"${n ? '' : ' disabled'}>Nuova spesa</button></div>`;
    $('#shop-list').innerHTML = gs.map(([c, e, list]) => `<div class="card">
      <div class="row"><b>${c}</b><span class="r mut" style="font-size:13px">${e}</span></div>
      ${list.map(([nm, q]) => { const k = key(c, nm); return `<div class="row chk${done.has(k) ? ' done' : ''}" data-k="${esc(k)}"><span class="box"></span><span class="n">${esc(nm)}</span>${q ? `<span class="q">${q}</span>` : ''}${c === 'Altro' ? `<button class="del" data-x="${esc(nm)}" aria-label="Rimuovi">×</button>` : ''}</div>`; }).join('')}
    </div>`).join('');
  };
  draw();
  $('#v-spesa').addEventListener('click', e => {
    const del = e.target.closest('.del');
    if (del) { extra = extra.filter(x => x !== del.dataset.x); done.delete(key('Altro', del.dataset.x)); save(); draw(); return; }
    const row = e.target.closest('.chk');
    if (row) { const k = row.dataset.k; done.has(k) ? done.delete(k) : done.add(k); save(); draw(); return; }
    if (e.target.closest('#shop-reset') && confirm('Nuova spesa? Tutte le spunte verranno tolte.')) { done.clear(); save(); draw(); }
  });
  $('#shop-add').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#shop-in').value.trim();
    if (v && !extra.includes(v)) { extra.push(v); save(); draw(); }
    $('#shop-in').value = '';
  });
}

/* ---------- Tab ---------- */
const TITLES = { piano: 'Piano', dieta: 'Dieta', ricette: 'Ricette', allenamento: 'Allenamento', spesa: 'Spesa' };
function go(tab, scroll = true) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + tab));
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#title').textContent = TITLES[tab];
  store.set('tab', tab);
  if (scroll) window.scrollTo(0, 0);
}
$('#tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });

renderPiano(); renderDieta(); renderRicette(); renderAllenamento(); renderSpesa();
const saved = store.get('tab', 'piano');
go(TITLES[saved] ? saved : 'piano', false);
</script>
